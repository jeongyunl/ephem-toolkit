<svg xmlns="http://www.w3.org/2000/svg" width="1384" height="420" viewBox="28 544 1384 420" role="img" aria-labelledby="title desc">
  <title id="title">Archived: Splitter-first play-oem workspace mock-up</title>
  <desc id="desc">A wx.SplitterWindow displays trajectory and speed-altitude plots side by side, each with its own view-selection combobox, above persistent playback controls and a shared timeline.</desc>
  <defs>
    <style>
      .bg{fill:#eef2f7}
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5}
      .window{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .chrome{fill:#e8edf3}
      .ink{fill:#152235;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#65758b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h1{font-size:27px;font-weight:700}
      .h2{font-size:18px;font-weight:700}
      .body{font-size:14px}
      .small{font-size:12px}
      .tiny{font-size:10px}
      .tab{fill:#e9eef5;stroke:#d2dbe6;stroke-width:1}
      .tabon{fill:#fff;stroke:#b9c9dc;stroke-width:1.2}
      .panel{fill:#fff;stroke:#dce4ed;stroke-width:1}
      .sash{fill:#d2dbe6}
      .grid{stroke:#dbe4ee;stroke-width:1}
      .line{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .orbit{fill:none;stroke:#22a69a;stroke-width:3;stroke-linecap:round}
      .primary{fill:#2563eb}
    </style>
  </defs>
