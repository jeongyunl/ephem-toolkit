<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Ground Station Access view mock-up</title>
  <desc id="desc">Illustrative play-oem graph panel with the selected ground station's elevation plotted against time, its elevation mask and access spans, a synchronized current-time cursor, live azimuth, elevation, and range, and current and upcoming pass summaries. The chart uses illustrative data.</desc>
  <defs>
    <style>
      .bg{fill:#f1f4f8}.window{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.chrome{fill:#e8edf3}
      .ink{fill:#17263a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#63748b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:22px;font-weight:700}.heading{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.tiny{font-size:10px}
      .pane{fill:#fff;stroke:#d5dee9;stroke-width:1.2}.rule{stroke:#e1e7ef;stroke-width:1}.grid{stroke:#e1e7ef;stroke-width:1}
      .access{fill:#bfe7d7;stroke:#23866b;stroke-width:1}.upcoming{fill:#dbeafe;stroke:#477cc6;stroke-width:1}
      .clipped{fill:url(#hatch);stroke:#ad8b22;stroke-width:1}.now{stroke:#df4d66;stroke-width:2}
      .curve{fill:none;stroke:#2f7ebc;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .maskline{stroke:#c74343;stroke-width:1.5;stroke-dasharray:6 4}
      .button{fill:#fff;stroke:#bac8d8;stroke-width:1.2}.badge{fill:#e4f5ec}.badgetext{fill:#17654f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;font-weight:700}
      .icon{fill:none;stroke:#687a90;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fff7d8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d8b84f" stroke-width="2"/>
    </pattern>
  </defs>
  <rect class="bg" width="1480" height="900"/>
  <rect class="window" x="20" y="18" width="1440" height="864" rx="14"/>
  <path class="chrome" d="M34 18h1412a14 14 0 0 1 14 14v35H20V32a14 14 0 0 1 14-14z"/>
  <circle cx="47" cy="42" r="5" fill="#ed7777"/><circle cx="65" cy="42" r="5" fill="#e7bd55"/><circle cx="83" cy="42" r="5" fill="#68bd7d"/>
  <text class="muted small" x="105" y="46">play-oem · ISS_2026-05-20.OEM</text>

