      .marker{fill:#e74d69;stroke:#fff;stroke-width:2}.station{fill:#2574c7;stroke:#fff;stroke-width:2}
      .stationselected{fill:#0e9a83;stroke:#fff;stroke-width:2}.skyline{fill:none;stroke:#2574c7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .pass{fill:#e8f3ff}.passselected{fill:#d6e8ff;stroke:#77a8e8;stroke-width:1}
      .curve{fill:none;stroke:#2f7ebc;stroke-width:2;stroke-linecap:round}.maskline{stroke:#c74343;stroke-width:1.2;stroke-dasharray:5 3}
      .status{fill:#e4f5ec}.statustext{fill:#17654f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:9px;font-weight:700}
