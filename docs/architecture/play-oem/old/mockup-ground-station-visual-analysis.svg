      .primary{fill:#2563eb}.primarytext{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;font-weight:600}
      .rule{stroke:#e1e7ef;stroke-width:1}.grid{fill:none;stroke:#e1e7ef;stroke-width:1}
