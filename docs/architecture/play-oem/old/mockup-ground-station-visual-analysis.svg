<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">Archived Ground Station Visual Analysis mock-up</title>
  <desc id="desc">Illustrative play-oem three-pane workspace with station markers on the Ground Track map, a Ground Station Passes table linked to an azimuth/elevation sky plot, and the existing elevation-over-time Access graph in Comparison.</desc>
