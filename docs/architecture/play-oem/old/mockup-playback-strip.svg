  <text class="ink small" x="1180" y="479" text-anchor="middle">Motion…</text>
  <rect class="button" x="1248" y="458" width="104" height="32" rx="7"/>
  <text class="ink small" x="1300" y="479" text-anchor="middle">Details ▾</text>
  <text class="muted small" x="58" y="566">Separate plot windows · independently movable and resizable</text>
