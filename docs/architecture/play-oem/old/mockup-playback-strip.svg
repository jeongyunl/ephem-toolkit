<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="740" viewBox="32 108 1376 740" role="img" aria-labelledby="title desc">
  <title id="title">Archived: Playback strip GUI mock-up</title>
  <desc id="desc">A compact wxPython control frame with detached plot windows, playback transport, a timeline, and current-state summary.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .bg{fill:#eef2f7}
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5}
      .window{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .chrome{fill:#e8edf3}
      .ink{fill:#152235;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#65758b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h1{font-size:28px;font-weight:700}
      .h2{font-size:19px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:12px}
      .tiny{font-size:10px}
      .button{fill:#fff;stroke:#bdcad8;stroke-width:1.2}
      .selected{fill:#e9f2ff;stroke:#6aa2f8;stroke-width:1.4}
      .primary{fill:#2563eb}
      .panel{fill:#fff;stroke:#dce4ed;stroke-width:1}
      .grid{stroke:#dbe4ee;stroke-width:1}
      .plot{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .orbit{fill:none;stroke:#22a69a;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <!-- Concept A -->
  <rect class="card" x="32" y="108" width="1376" height="740" rx="18"/>
  <text class="ink h2" x="58" y="145">A · Playback strip</text>
  <text class="muted body" x="58" y="170">Compact control frame with detached plot windows · closest to the current architecture</text>
