  <circle cx="635" cy="389" r="9" fill="#2563eb" stroke="#fff" stroke-width="3"/>
  <text class="muted tiny" x="1355" y="394" text-anchor="end">06:00</text>
  <rect class="button" x="82" y="411" width="280" height="34" rx="7"/>
