  <text class="ink small" x="470" y="433">r  (−2,143.5, 5,982.1, 1,423.7) km</text>
  <text class="muted small" x="895" y="433">v  (−6.91, −2.14, 3.02) km/s</text>
  <rect x="82" y="463" width="96" height="29" rx="14" fill="#e8f7f3"/>
