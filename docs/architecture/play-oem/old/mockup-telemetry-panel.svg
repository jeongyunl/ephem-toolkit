  <circle cx="649" cy="1365" r="3.5" fill="#9aa8b9"/>
  <circle cx="662" cy="1365" r="3.5" fill="#9aa8b9"/>
  <text class="ink small" x="644" y="1382" font-weight="700">SPEED / ALTITUDE</text>
