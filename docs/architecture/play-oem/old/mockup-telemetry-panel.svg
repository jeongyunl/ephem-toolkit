  <rect class="button" x="450" y="1422" width="102" height="30" rx="7"/>
  <text class="ink small" x="501" y="1442" text-anchor="middle">Views ▾</text>
  <rect class="button" x="82" y="1498" width="470" height="0" rx="7"/>
  <text class="muted tiny" x="82" y="1511">Details ▸  ·  Time entry and step controls in expanded section</text>

  <text class="muted small" x="620" y="1190" font-weight="700">DETACHED PLOT WINDOWS</text>
  <rect class="panel" x="620" y="1210" width="742" height="132" rx="10"/>
  <rect class="chrome" x="620" y="1210" width="742" height="22" rx="10"/>
  <rect class="chrome" x="620" y="1222" width="742" height="10"/>
  <circle cx="636" cy="1221" r="3.5" fill="#9aa8b9"/>
  <circle cx="649" cy="1221" r="3.5" fill="#9aa8b9"/>
  <circle cx="662" cy="1221" r="3.5" fill="#9aa8b9"/>
  <text class="ink small" x="644" y="1238" font-weight="700">TRAJECTORY · OVERVIEW</text>
