<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="500" viewBox="32 1048 1376 500" role="img" aria-labelledby="title desc">
  <title id="title">Archived: Compact telemetry panel GUI mock-up</title>
  <desc id="desc">A narrow wxPython playback and telemetry window beside detached trajectory and speed-altitude plots.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .bg{fill:#eef2f7}
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5}
      .window{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .chrome{fill:#e8edf3}
      .ink{fill:#152235;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#65758b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h1{font-size:28px;font-weight:700}
      .h2{font-size:19px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:12px}
      .tiny{font-size:10px}
      .button{fill:#fff;stroke:#bdcad8;stroke-width:1.2}
      .selected{fill:#e9f2ff;stroke:#6aa2f8;stroke-width:1.4}
      .primary{fill:#2563eb}
      .panel{fill:#fff;stroke:#dce4ed;stroke-width:1}
      .grid{stroke:#dbe4ee;stroke-width:1}
      .plot{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .orbit{fill:none;stroke:#22a69a;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <!-- Concept C -->
  <rect class="card" x="32" y="1048" width="1376" height="500" rx="18"/>
  <text class="ink h2" x="58" y="1085">C · Compact telemetry panel</text>
  <text class="muted body" x="58" y="1110">Narrow vertical control window beside plots · time and state take priority</text>
  <rect class="window" x="58" y="1130" width="518" height="390" rx="12"/>
  <rect class="chrome" x="58" y="1130" width="518" height="34" rx="12"/>
  <rect class="chrome" x="58" y="1151" width="518" height="13"/>
  <circle cx="78" cy="1147" r="5" fill="#9aa8b9"/>
  <circle cx="96" cy="1147" r="5" fill="#9aa8b9"/>
  <circle cx="114" cy="1147" r="5" fill="#9aa8b9"/>
  <text class="muted small" x="138" y="1151">play-oem · Player</text>
  <text class="ink small" x="82" y="1190" font-weight="700">ISS · GCRF</text>
  <text class="muted tiny" x="552" y="1190" text-anchor="end">5,402 samples</text>
  <text class="ink" x="82" y="1230" font-size="25" font-weight="700">02:14:32.400</text>
  <text class="muted small" x="82" y="1252">2026-05-20 02:14:32 UTC</text>
  <rect x="72" y="1261" width="480" height="57" rx="9" fill="#eef2f7"/>
  <rect class="primary" x="82" y="1270" width="102" height="40" rx="8"/>
