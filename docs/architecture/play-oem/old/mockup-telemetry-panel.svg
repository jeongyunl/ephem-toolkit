  <line class="grid" x1="644" y1="1410" x2="1338" y2="1410"/>
  <line class="grid" x1="644" y1="1438" x2="1338" y2="1438"/>
  <line class="grid" x1="644" y1="1466" x2="1338" y2="1466"/>
  <path class="plot" d="M654 1450 C720 1420,775 1462,836 1438 S950 1427,1007 1450 S1113 1433,1170 1443 S1274 1417,1327 1434"/>
  <line x1="1127" y1="1400" x2="1127" y2="1474" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
