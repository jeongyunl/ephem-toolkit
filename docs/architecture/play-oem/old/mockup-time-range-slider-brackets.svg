    <circle cx="863.3333335" cy="745" r="7" fill="#b85012" stroke="white" stroke-width="2" />
    <text x="680" y="775" font-size="11" fill="#607188" font-weight="400" text-anchor="start">08:00</text>
    <text x="1120" y="775" font-size="11" fill="#607188" font-weight="400" text-anchor="end">20:00</text>
    <text x="680" y="800" font-size="13" fill="#24354b" font-weight="600" text-anchor="start">Plot 11:00–15:00 UTC</text>
    <text x="600" y="731" font-size="24" fill="#607188" font-weight="400" text-anchor="middle">→</text>
    <rect x="24" y="844" width="1152" height="108" rx="7" fill="#ffffff" stroke="#d7e0eb" />
    <text x="48" y="868" font-size="10" fill="#607188" font-weight="600" text-anchor="start">COINCIDENT POSITIONS</text>
