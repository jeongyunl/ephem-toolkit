      <line x1="1104" y1="354" x2="1104" y2="361" stroke="#9aacbf" stroke-width="1" />
      <text x="96" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">08:00</text>
      <text x="264" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">10:00</text>
      <text x="432" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">12:00</text>
      <text x="600" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">14:00</text>
      <text x="768" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">16:00</text>
      <text x="936" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">18:00</text>
      <text x="1104" y="382" font-size="12" fill="#607188" font-weight="400" text-anchor="middle">20:00</text>
      <text x="96" y="407" font-size="11" fill="#607188" font-weight="400" text-anchor="start">OEM start · 08:00 UTC</text>
      <text x="1104" y="407" font-size="11" fill="#607188" font-weight="400" text-anchor="end">OEM end · 20:00 UTC</text>
      <text x="600" y="407" font-size="11" fill="#607188" font-weight="400" text-anchor="middle">Playback span 10:00–14:00 · plot continues to 15:00</text>
      <text x="32" y="461" font-size="14" fill="#24354b" font-weight="600" text-anchor="start">Each endpoint has its own type. Dragging its handle preserves that type.</text>
      <text x="32" y="486" font-size="13" fill="#607188" font-weight="400" text-anchor="start">Plot range is independent of playback bounds and is clipped only to OEM coverage.</text>
    </g>
  </g>
  <g transform="translate(0 -16)">
    <rect x="24" y="586" width="1152" height="238" rx="7" fill="#ffffff" stroke="#d7e0eb" />
    <text x="48" y="618" font-size="11" fill="#607188" font-weight="600" text-anchor="start">WHAT CHANGES WHEN PLAYBACK ADVANCES?</text>
    <text x="48" y="644" font-size="16" fill="#24354b" font-weight="600" text-anchor="start">Both timestamps stay fixed.</text>
    <text x="80" y="676" font-size="13" fill="#a14913" font-weight="600" text-anchor="start">Playback 12:00 UTC</text>
