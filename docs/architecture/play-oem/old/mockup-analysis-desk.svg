  <rect class="panel" x="330" y="695" width="1038" height="166" rx="9"/>
  <text class="ink small" x="350" y="721" font-weight="700">TRAJECTORY 3D</text>
  <rect class="button" x="1167" y="706" width="181" height="23" rx="5"/>
  <text class="ink tiny" x="1178" y="721">Trajectory · 3D</text>
  <text class="muted tiny" x="1334" y="721" text-anchor="end">▾</text>
  <line class="grid" x1="350" y1="742" x2="1348" y2="742"/>
  <line class="grid" x1="350" y1="782" x2="1348" y2="782"/>
  <line class="grid" x1="350" y1="822" x2="1348" y2="822"/>
  <ellipse cx="850" cy="794" rx="214" ry="53" class="orbit"/>
  <ellipse cx="850" cy="794" rx="53" ry="27" fill="#dcecff" stroke="#93bdf8" stroke-width="1.5"/>
  <circle cx="1002" cy="759" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <text class="muted tiny" x="866" y="799">Earth</text>
  <rect class="panel" x="330" y="873" width="1038" height="113" rx="9"/>
  <text class="ink small" x="350" y="899" font-weight="700">SPEED &amp; ALTITUDE</text>
  <rect class="button" x="1167" y="884" width="181" height="23" rx="5"/>
  <text class="ink tiny" x="1178" y="899">Speed / Altitude</text>
  <text class="muted tiny" x="1334" y="899" text-anchor="end">▾</text>
  <line class="grid" x1="350" y1="925" x2="1348" y2="925"/>
  <line class="grid" x1="350" y1="951" x2="1348" y2="951"/>
  <line class="grid" x1="350" y1="974" x2="1348" y2="974"/>
  <path class="plot" d="M365 958 C430 934,480 972,540 947 S650 939,704 961 S810 942,873 950 S985 930,1040 951 S1150 945,1202 959 S1290 931,1334 943"/>
  <line x1="1002" y1="912" x2="1002" y2="978" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="72" y="963" width="244" height="23" rx="6" fill="#e6edf5"/>
  <text class="muted tiny" x="91" y="979">Timeline  00:00 ━━━━━●━━━━━━ 06:00</text>

</svg>
