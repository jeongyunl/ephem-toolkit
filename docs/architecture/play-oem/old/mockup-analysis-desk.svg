<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="460" viewBox="32 568 1376 460" role="img" aria-labelledby="title desc">
  <title id="title">Archived: Unified analysis desk GUI mock-up</title>
  <desc id="desc">A wxPython workspace with playback controls and trajectory and time-series panes, each with its own view-selection combobox.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .bg{fill:#eef2f7}
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5}
      .window{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .chrome{fill:#e8edf3}
      .ink{fill:#152235;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#65758b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h1{font-size:28px;font-weight:700}
      .h2{font-size:19px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:12px}
      .tiny{font-size:10px}
      .button{fill:#fff;stroke:#bdcad8;stroke-width:1.2}
      .selected{fill:#e9f2ff;stroke:#6aa2f8;stroke-width:1.4}
      .primary{fill:#2563eb}
      .panel{fill:#fff;stroke:#dce4ed;stroke-width:1}
      .grid{stroke:#dbe4ee;stroke-width:1}
      .plot{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .orbit{fill:none;stroke:#22a69a;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <!-- Concept B -->
  <rect class="card" x="32" y="568" width="1376" height="460" rx="18"/>
  <text class="ink h2" x="58" y="605">B · Unified analysis desk</text>
  <text class="muted body" x="58" y="630">One resizable workspace with dockable wx panes · views stay together</text>
  <rect class="window" x="58" y="650" width="1324" height="352" rx="12"/>
  <rect class="chrome" x="58" y="650" width="1324" height="34" rx="12"/>
  <rect class="chrome" x="58" y="671" width="1324" height="13"/>
  <circle cx="78" cy="667" r="5" fill="#9aa8b9"/>
  <circle cx="96" cy="667" r="5" fill="#9aa8b9"/>
  <circle cx="114" cy="667" r="5" fill="#9aa8b9"/>
  <text class="muted small" x="138" y="671">play-oem — ISS_2026-05-20.OEM</text>
  <rect class="button" x="900" y="655" width="106" height="24" rx="5"/>
  <text class="ink tiny" x="953" y="671" text-anchor="middle">Open view ▾</text>
  <rect class="button" x="1012" y="655" width="94" height="24" rx="5"/>
  <text class="ink tiny" x="1059" y="671" text-anchor="middle">Layout ▾</text>
  <rect class="button" x="1112" y="655" width="82" height="24" rx="5"/>
  <text class="ink tiny" x="1153" y="671" text-anchor="middle">Fit all</text>
  <rect class="button" x="1200" y="655" width="82" height="24" rx="5"/>
  <text class="ink tiny" x="1241" y="671" text-anchor="middle">Reset</text>
  <rect class="button" x="1288" y="655" width="78" height="24" rx="5"/>
  <text class="ink tiny" x="1327" y="671" text-anchor="middle">Export</text>
  <rect x="72" y="695" width="244" height="291" rx="9" fill="#f1f5f9"/>
  <text class="ink small" x="91" y="721" font-weight="700">PLAYBACK</text>
  <text class="ink" x="91" y="754" font-size="22" font-weight="700">02:14:32</text>
  <text class="muted small" x="91" y="775">UTC · 2026-05-20</text>
  <rect class="primary" x="91" y="792" width="98" height="36" rx="7"/>
  <text class="white body" x="140" y="816" text-anchor="middle">Ⅱ Pause</text>
  <rect class="button" x="198" y="792" width="98" height="36" rx="7"/>
  <text class="ink small" x="247" y="815" text-anchor="middle">Reverse</text>
  <text class="muted tiny" x="91" y="852">SPEED</text>
  <text class="ink small" x="91" y="874" font-weight="600">−60×</text>
  <line x1="132" y1="870" x2="296" y2="870" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="207" cy="870" r="7" fill="#2563eb"/>
  <text class="muted tiny" x="91" y="900">1×</text>
  <text class="muted tiny" x="296" y="900" text-anchor="end">1000×</text>
