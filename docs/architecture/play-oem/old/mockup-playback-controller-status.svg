<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">Playback controller mock-up: transport with speed status</title>
  <desc id="desc">The eight-button transport row separates reverse and forward play/pause controls, with an explicit signed speed status above and the time slider below.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172235}
    .muted{fill:#63738a}.button{fill:#f4f7fb;stroke:#c8d3e0}.selected{fill:#dceafe;stroke:#3979d3}.primary{fill:#2867c7}
  </style>
  <rect x="20" y="18" width="960" height="194" rx="12" fill="#fff" stroke="#d6deea"/>
  <text x="44" y="48" font-size="17" font-weight="700">C · Transport with speed status</text>
  <text x="44" y="78" font-size="12" class="muted">Start UTC: 2026-05-20</text>
  <text x="500" y="78" font-size="12" class="muted" text-anchor="middle">Current UTC: 02:14:32</text>
  <text x="956" y="78" font-size="12" class="muted" text-anchor="end">End UTC: 08:14:32</text>
  <text x="500" y="103" font-size="12" font-weight="600" fill="#2867c7" text-anchor="middle">Playing backward · −100×</text>
  <g font-size="13" text-anchor="middle">
    <rect class="button" x="205" y="111" width="74" height="32" rx="6"/><text x="242" y="132">&lt;&lt;&lt; 1000×</text>
    <rect class="selected" x="285" y="111" width="68" height="32" rx="6"/><text x="319" y="132">&lt;&lt; 100×</text>
    <rect class="button" x="359" y="111" width="62" height="32" rx="6"/><text x="390" y="132">&lt; 10×</text>
    <rect class="primary" x="427" y="111" width="80" height="32" rx="6"/><text x="467" y="132" fill="#fff">Ⅱ Pause</text>
    <rect class="button" x="513" y="111" width="80" height="32" rx="6"/><text x="553" y="132">▶ 1×</text>
    <rect class="button" x="599" y="111" width="62" height="32" rx="6"/><text x="630" y="132">10× &gt;</text>
    <rect class="button" x="667" y="111" width="68" height="32" rx="6"/><text x="701" y="132">100× &gt;&gt;</text>
    <rect class="button" x="741" y="111" width="74" height="32" rx="6"/><text x="778" y="132">1000× &gt;&gt;&gt;</text>
  </g>
  <line x1="62" y1="178" x2="938" y2="178" stroke="#c5d0dd" stroke-width="6" stroke-linecap="round"/>
  <line x1="62" y1="178" x2="414" y2="178" stroke="#4385df" stroke-width="6" stroke-linecap="round"/>
  <circle cx="414" cy="178" r="9" fill="#2867c7"/>
</svg>
