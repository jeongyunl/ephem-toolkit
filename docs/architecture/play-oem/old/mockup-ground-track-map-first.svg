<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Ground Track mock-up: map first</title>
  <desc id="desc">A full-world equirectangular ground track panel with both poles, satellite path, horizon and minimum-elevation footprints, projection, elevation, and center-longitude controls, and zoom tools.</desc>
  <defs>
    <style>
      .bg{fill:#eef2f7}.card{fill:#fff;stroke:#d4deea;stroke-width:1.5}.chrome{fill:#e7edf4}
      .ink{fill:#17263a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#63748b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:25px;font-weight:700}.body{font-size:15px}.small{font-size:12px}.tiny{font-size:10px}
      .button{fill:#fff;stroke:#bdcad8;stroke-width:1.2}.grid{stroke:#cbd7e4;stroke-width:1;stroke-dasharray:3 4}
      .land{fill:#dce9df;stroke:#b8cabb;stroke-width:1}.coast{fill:none;stroke:#8caf9a;stroke-width:1.2}
      .track{fill:none;stroke:#345fe7;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .horizon{fill:none;stroke:#ef8a36;stroke-width:2.4;stroke-dasharray:7 5}
      .mask{fill:#e6d84a;fill-opacity:.12;stroke:#a58d00;stroke-width:2.4}
      .marker{fill:#f23d68;stroke:#fff;stroke-width:3}
    </style>
    <clipPath id="mapClip"><rect x="118" y="226" width="884" height="398" rx="7"/></clipPath>
  </defs>
  <rect class="bg" width="1120" height="720"/>
  <rect class="card" x="22" y="20" width="1076" height="680" rx="12"/>
  <rect class="chrome" x="22" y="20" width="1076" height="54" rx="12"/>
  <circle cx="47" cy="47" r="6" fill="#f17474"/><circle cx="68" cy="47" r="6" fill="#e8bd54"/><circle cx="89" cy="47" r="6" fill="#63bd7b"/>
  <text class="ink title" x="118" y="55">Ground Track</text>
  <text class="muted small" x="917" y="52">ISS · GCRF → ITRF</text>

  <rect class="button" x="54" y="96" width="200" height="42" rx="6"/>
  <text class="muted small" x="68" y="113">Projection</text><text class="ink body" x="68" y="130">Equirectangular  ▾</text>
  <rect class="button" x="270" y="96" width="212" height="42" rx="6"/>
  <text class="muted small" x="284" y="113">Minimum elevation</text><text class="ink body" x="284" y="130">10°  ▾</text>
  <rect class="button" x="500" y="96" width="142" height="42" rx="6"/><text class="muted tiny" x="512" y="112">Center longitude</text><text class="ink body" x="512" y="130">0° E  ▾</text>
  <rect class="button" x="654" y="96" width="43" height="42" rx="6"/><text class="ink body" x="668" y="123">⌂</text>
  <rect class="button" x="704" y="96" width="43" height="42" rx="6"/><text class="ink body" x="716" y="123">＋</text>
  <rect class="button" x="754" y="96" width="43" height="42" rx="6"/><text class="ink body" x="767" y="123">−</text>
  <rect class="button" x="804" y="96" width="43" height="42" rx="6"/><text class="ink body" x="818" y="123">✋</text>
  <text class="muted small" x="861" y="122">Wheel zoom · drag pan</text>

  <rect x="118" y="226" width="884" height="398" rx="7" fill="#f8fbff" stroke="#aebdcd" stroke-width="1.2"/>
  <g clip-path="url(#mapClip)">
    <path class="grid" d="M118 326H1002 M118 425H1002 M118 525H1002 M294 226V624 M471 226V624 M648 226V624 M825 226V624"/>
    <path class="land" d="M164 303l35-37 58-12 32 19-13 26 26 15-9 34-35 10-14 35-34 3-14-28-28-9-15-27-31-5z M299 399l27 14 11 30-12 36 13 24-15 29-18-18-8-35-21-26 7-32z M491 293l28-19 39 10 16 19 38-7 28 15 3 23-34 9-7 28-21 13-16 38-22 8-15-31-25-13-8-34-21-20z M537 412l24 8 18 31-3 35-20 36-20-12-11-36 3-37z M665 297l37-19 46 6 28 19 43 1 31 22-12 29-39 1-23 20-38-10-26 16-29-19-37 2-14-22 22-23z M815 506l31-15 30 15-6 18-35 7z"/>
    <path class="grid" d="M118 226H1002 M118 624H1002"/>
    <path class="track" d="M124 500 C190 465 239 410 300 370 S405 308 470 353 S560 488 624 475 S733 354 790 318 S912 332 997 405"/>
    <path class="horizon" d="M572 367 C597 336 653 332 682 358 C710 384 703 427 677 447 C649 469 604 456 584 430 C570 411 560 387 572 367Z"/>
    <path class="mask" d="M591 378 C610 356 646 354 665 371 C684 389 681 416 664 431 C644 449 615 441 600 423 C588 409 583 391 591 378Z"/>
    <circle class="marker" cx="625" cy="400" r="8"/>
  </g>
  <text class="muted tiny" x="106" y="231" text-anchor="end">90° N</text><text class="muted tiny" x="106" y="430" text-anchor="end">0°</text><text class="muted tiny" x="106" y="628" text-anchor="end">90° S</text>
  <text class="muted tiny" x="118" y="646">180° W</text><text class="muted tiny" x="550" y="646">0°</text><text class="muted tiny" x="1002" y="646" text-anchor="end">180° E</text>

  <line x1="80" y1="674" x2="112" y2="674" class="track"/><text class="ink small" x="120" y="679">Ground track</text>
  <line x1="250" y1="674" x2="282" y2="674" class="horizon"/><text class="ink small" x="290" y="679">0° horizon</text>
  <line x1="410" y1="674" x2="442" y2="674" class="mask"/><text class="ink small" x="450" y="679">10° minimum elevation</text>
  <circle class="marker" cx="672" cy="674" r="6"/><text class="ink small" x="686" y="679">Current position</text>
  <text class="muted small" x="885" y="679">Lat  12.4° N   Lon  48.7° E</text>
</svg>
