<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Compact TimeScrubber mockup</title>
  <desc id="desc">Two compact horizontal TimeScrubber instances modeled after the TimeScrubber design: Default uses full OEM coverage and Range-Limited uses an eight-hour viewport. Each row has a visible painted left chevron, centered current-time label, existing TimeSlider, tick labels, and visible painted right chevron.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
  <rect width="1200" height="620" fill="#f3f6fa"/>
  <text x="24" y="44" font-size="34" fill="#24354b" font-weight="700">TimeScrubber</text>

  <rect x="24" y="78" width="1152" height="228" rx="7" fill="#fff" stroke="#d7e0eb"/>
  <text x="82" y="118" font-size="16" fill="#24354b" font-weight="700">Default</text>
  <text x="600" y="154" font-size="20" fill="#24354b" font-weight="700" text-anchor="middle">1:00 PM</text>

  <rect x="82" y="174" width="1036" height="82" rx="7" fill="#fafafa" stroke="#cfd6df"/>
  <rect x="82" y="174" width="30" height="52" rx="5" fill="#fafafa" stroke="#cfd6df"/>
  <text x="97" y="207" font-size="20" fill="#4a5564" text-anchor="middle">&lt;</text>
  <rect x="1088" y="174" width="30" height="52" rx="5" fill="#fafafa" stroke="#cfd6df"/>
  <text x="1103" y="207" font-size="20" fill="#4a5564" text-anchor="middle">&gt;</text>

  <line x1="112" y1="200" x2="1088" y2="200" stroke="#b9c7d8" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="200" x2="930" y2="200" stroke="#197765" stroke-width="10"/>
  <line x1="420" y1="200" x2="720" y2="200" stroke="#2864c8" stroke-width="4"/>
  <circle cx="650" cy="200" r="9" fill="#fafafa" stroke="#b85012" stroke-width="3"/>
  <g stroke="#93a6bf" stroke-width="1">
    <line x1="112" y1="224" x2="112" y2="232"/><line x1="194" y1="224" x2="194" y2="232"/>
    <line x1="276" y1="224" x2="276" y2="232"/><line x1="358" y1="224" x2="358" y2="232"/>
    <line x1="440" y1="224" x2="440" y2="232"/><line x1="522" y1="224" x2="522" y2="232"/>
    <line x1="604" y1="224" x2="604" y2="232"/><line x1="686" y1="224" x2="686" y2="232"/>
    <line x1="768" y1="224" x2="768" y2="232"/><line x1="850" y1="224" x2="850" y2="232"/>
    <line x1="932" y1="224" x2="932" y2="232"/><line x1="1010" y1="224" x2="1010" y2="232"/>
    <line x1="1088" y1="224" x2="1088" y2="232"/>
  </g>
  <g font-size="12" fill="#607188" text-anchor="middle">
    <text x="112" y="248">7 AM</text><text x="194" y="248">8 AM</text>
    <text x="276" y="248">9 AM</text><text x="358" y="248">10 AM</text>
    <text x="440" y="248">11 AM</text><text x="522" y="248">12 PM</text>
    <text x="604" y="248">1 PM</text><text x="686" y="248">2 PM</text>
    <text x="768" y="248">3 PM</text><text x="850" y="248">4 PM</text>
    <text x="932" y="248">5 PM</text><text x="1010" y="248">6 PM</text>
    <text x="1088" y="248">7 PM</text>
  </g>

  <rect x="24" y="328" width="1152" height="228" rx="7" fill="#fff" stroke="#d7e0eb"/>
  <text x="82" y="368" font-size="16" fill="#24354b" font-weight="700">Range-Limited</text>
  <text x="600" y="404" font-size="20" fill="#24354b" font-weight="700" text-anchor="middle">4:15 PM</text>

  <rect x="82" y="424" width="1036" height="82" rx="7" fill="#fafafa" stroke="#cfd6df"/>
  <rect x="82" y="424" width="30" height="52" rx="5" fill="#fafafa" stroke="#cfd6df"/>
  <text x="97" y="457" font-size="20" fill="#4a5564" text-anchor="middle">&lt;</text>
  <rect x="1088" y="424" width="30" height="52" rx="5" fill="#fafafa" stroke="#cfd6df"/>
  <text x="1103" y="457" font-size="20" fill="#4a5564" text-anchor="middle">&gt;</text>

  <line x1="112" y1="450" x2="1088" y2="450" stroke="#b9c7d8" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="450" x2="930" y2="450" stroke="#197765" stroke-width="10"/>
  <line x1="420" y1="450" x2="720" y2="450" stroke="#2864c8" stroke-width="4"/>
  <circle cx="650" cy="450" r="9" fill="#fafafa" stroke="#b85012" stroke-width="3"/>
  <g stroke="#93a6bf" stroke-width="1">
    <line x1="112" y1="474" x2="112" y2="482"/><line x1="194" y1="474" x2="194" y2="482"/>
    <line x1="276" y1="474" x2="276" y2="482"/><line x1="358" y1="474" x2="358" y2="482"/>
    <line x1="440" y1="474" x2="440" y2="482"/><line x1="522" y1="474" x2="522" y2="482"/>
    <line x1="604" y1="474" x2="604" y2="482"/><line x1="686" y1="474" x2="686" y2="482"/>
    <line x1="768" y1="474" x2="768" y2="482"/><line x1="850" y1="474" x2="850" y2="482"/>
    <line x1="932" y1="474" x2="932" y2="482"/><line x1="1010" y1="474" x2="1010" y2="482"/>
    <line x1="1088" y1="474" x2="1088" y2="482"/>
  </g>
  <g font-size="12" fill="#607188" text-anchor="middle">
    <text x="112" y="498">10 AM</text><text x="194" y="498">11 AM</text>
    <text x="276" y="498">12 PM</text><text x="358" y="498">1 PM</text>
    <text x="440" y="498">2 PM</text><text x="522" y="498">3 PM</text>
    <text x="604" y="498">4 PM</text><text x="686" y="498">5 PM</text>
    <text x="768" y="498">6 PM</text><text x="850" y="498">7 PM</text>
    <text x="932" y="498">8 PM</text><text x="1010" y="498">9 PM</text>
    <text x="1088" y="498">10 PM</text>
  </g>
</svg>

