<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Ground Track mock-up: footprint emphasis</title>
  <desc id="desc">A full-world Robinson ground track panel emphasizing distinct horizon and minimum-elevation coverage boundaries, center longitude control, and shared elevation control. Map navigation updates the center longitude.</desc>
  <defs>
    <style>
      .bg{fill:#f0f3f7}.panel{fill:#fff;stroke:#d7e0e9;stroke-width:1.4}.head{fill:#e9eef4}.ink{fill:#18283d;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#65758a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:24px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}
      .grid{fill:none;stroke:#ccd7e2;stroke-width:1;stroke-dasharray:3 4}.land{fill:#e5eadf;stroke:#c6d0bd;stroke-width:1}
      .track{fill:none;stroke:#3b5dc9;stroke-width:3;stroke-linecap:round}.outer{fill:#ef8746;fill-opacity:.08;stroke:#d87832;stroke-width:2.6;stroke-dasharray:8 5}
      .inner{fill:#29a6a0;fill-opacity:.12;stroke:#16877e;stroke-width:2.6}.marker{fill:#e63e68;stroke:#fff;stroke-width:3}.control{fill:#f9fbfd;stroke:#c6d2df;stroke-width:1.2}
    </style>
    <clipPath id="map"><path d="M129 246 Q560 202 991 246 Q1030 424 991 602 Q560 646 129 602 Q90 424 129 246Z"/></clipPath>
  </defs>
  <rect class="bg" width="1120" height="720"/><rect class="panel" x="22" y="20" width="1076" height="680" rx="12"/><rect class="head" x="22" y="20" width="1076" height="55" rx="12"/>
  <circle cx="48" cy="48" r="6" fill="#ef7777"/><circle cx="69" cy="48" r="6" fill="#e7bd55"/><circle cx="90" cy="48" r="6" fill="#67bd7e"/><text class="ink title" x="120" y="57">Ground Track · Coverage</text><text class="muted small" x="865" y="53">Current time  2026-10-22 14:32:10 UTC</text>
  <rect class="control" x="62" y="98" width="218" height="42" rx="6"/><text class="muted small" x="76" y="115">Projection</text><text class="ink body" x="76" y="132">Robinson  ▾</text>
  <text class="muted small" x="62" y="166">Center longitude</text><rect class="control" x="62" y="174" width="142" height="34" rx="5"/><text class="ink body" x="76" y="196">0° E</text><text class="muted tiny" x="62" y="223">updates on pan/zoom</text>
  <text class="muted small" x="312" y="111">Minimum elevation</text><text class="ink body" x="312" y="132">10°</text>
  <line x1="404" y1="120" x2="684" y2="120" stroke="#c3cfdb" stroke-width="5" stroke-linecap="round"/><line x1="404" y1="120" x2="435" y2="120" stroke="#16877e" stroke-width="5" stroke-linecap="round"/><circle cx="435" cy="120" r="9" fill="#16877e" stroke="#fff" stroke-width="3"/>
  <text class="muted tiny" x="400" y="141">0°</text><text class="muted tiny" x="680" y="141" text-anchor="end">90°</text>
  <rect class="control" x="721" y="98" width="42" height="42" rx="6"/><text class="ink body" x="735" y="125">⌂</text><rect class="control" x="769" y="98" width="42" height="42" rx="6"/><text class="ink body" x="781" y="125">＋</text><rect class="control" x="817" y="98" width="42" height="42" rx="6"/><text class="ink body" x="831" y="125">−</text><rect class="control" x="865" y="98" width="42" height="42" rx="6"/><text class="ink body" x="878" y="125">↔</text><text class="muted small" x="925" y="123">Wheel zoom · drag pan</text>
  <path d="M129 246 Q560 202 991 246 Q1030 424 991 602 Q560 646 129 602 Q90 424 129 246Z" fill="#f8fbff" stroke="#aebdca" stroke-width="1.4"/>
  <g clip-path="url(#map)">
    <path class="grid" d="M106 331 Q560 291 1014 331 M100 424H1020 M106 517 Q560 557 1014 517 M285 215 Q230 424 285 633 M420 207 Q390 424 420 641 M560 202V646 M700 207 Q730 424 700 641 M835 215 Q890 424 835 633"/>
    <path class="land" d="M168 330l50-45 62-8 44 22-12 34 30 20-17 39-44 6-18 30-34-8-21-27-35-16-10-26-29-5z M320 420l29 20 11 38-16 33 10 35-21 22-19-34-15-42 8-36z M485 319l39-23 43 13 29 30 37-12 44 23 2 30-40 13-6 30-27 13-14 32-25 0-12-33-30-12-8-36-34-25z M546 452l23 8 14 37-11 43-25 28-16-29 2-44z M675 316l42-20 49 10 36 22 48-1 31 26-20 29-45 1-22 24-42-15-31 11-29-27-40-1-13-25z M841 524l35-16 33 17-11 19-35 7z"/>
    <path class="track" d="M128 517 C215 474 319 431 405 369 S548 314 617 382 S728 516 807 460 S908 365 992 333"/>
    <path class="outer" d="M631 356 C662 329 715 330 744 354 C776 380 780 425 755 454 C728 485 677 480 649 454 C622 429 607 382 631 356Z"/>
    <path class="inner" d="M650 370 C675 350 709 351 731 370 C753 388 757 418 737 438 C716 458 682 453 661 435 C642 418 634 386 650 370Z"/>
    <circle class="marker" cx="694" cy="403" r="8"/>
  </g>
  <text class="muted tiny" x="560" y="235" text-anchor="middle">North Pole</text><text class="muted tiny" x="560" y="624" text-anchor="middle">South Pole</text>
  <rect x="62" y="661" width="24" height="12" rx="6" fill="#ef8746" fill-opacity=".2" stroke="#d87832" stroke-dasharray="4 2"/><text class="ink small" x="94" y="672">0° horizon</text>
  <rect x="208" y="661" width="24" height="12" rx="6" fill="#29a6a0" fill-opacity=".2" stroke="#16877e"/><text class="ink small" x="240" y="672">10° minimum elevation</text>
  <line x1="406" y1="667" x2="438" y2="667" class="track"/><text class="ink small" x="446" y="672">Ground track</text><circle class="marker" cx="572" cy="667" r="6"/><text class="ink small" x="586" y="672">Sub-satellite point</text>
  <text class="ink body" x="795" y="672">Lat  42.3° N · Lon  71.1° W</text>
</svg>
