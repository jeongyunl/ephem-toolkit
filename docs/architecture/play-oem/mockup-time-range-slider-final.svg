<path d="M63 697 L77 712 L63 727 L49 712 Z" fill="#f4f8ff" stroke="#2864c8" stroke-width="2.5"/>
<text x="92" y="717" font-size="14" fill="#24354b" font-weight="600" text-anchor="start">Plot range · outlined diamond grips</text>
<text x="48" y="759" font-size="13" fill="#24354b" font-weight="400" text-anchor="start">Plot grips occupy their own row above playback grips.</text>
<text x="48" y="784" font-size="13" fill="#607188" font-weight="400" text-anchor="start">Shape and fill distinguish them without relying on color.</text>
<text x="48" y="809" font-size="12" fill="#607188" font-weight="400" text-anchor="start">Drag a playback grip to change limits; clamp the clock if needed.</text>
<text x="48" y="833" font-size="12" fill="#607188" font-weight="400" text-anchor="start">Drag a plot grip to change only that plot endpoint.</text>
<text x="48" y="857" font-size="12" fill="#607188" font-weight="400" text-anchor="start">The native thumb seeks; plot bounds never limit playback.</text>
