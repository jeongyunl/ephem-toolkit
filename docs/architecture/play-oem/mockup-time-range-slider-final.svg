<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Final shared time slider: separate playback and plot handle rows</title>
<desc id="desc">A proposed custom widget derived from wx.Slider. Two solid green rounded handles select playback bounds 10:00 to 14:00 in the lower handle row. Two outlined blue diamond handles select plotting 11:00 to 15:00 in a separate row above. The playback row sits above the standard slider with a visible gap from its track. None has visible text on or beside it. Hover tooltips identify handles. The native current-time thumb is at 12:00. OEM coverage is 08:00 to 20:00 UTC on October 23, 2026. Compact plot inputs have Fixed time checkboxes on the right. Plot range is independent of playback range.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
