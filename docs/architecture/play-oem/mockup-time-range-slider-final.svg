<text x="638" y="751" font-size="11" fill="#607188" font-weight="400" text-anchor="start">Resolved UTC: 2026-10-23 15:00:00Z</text>
<text x="624" y="794" font-size="13" fill="#24354b" font-weight="600" text-anchor="start">No persistent text on or next to the four range handles.</text>
<text x="624" y="820" font-size="12" fill="#607188" font-weight="400" text-anchor="start">When grips coincide, spread them horizontally within each row.</text>
<text x="624" y="844" font-size="12" fill="#607188" font-weight="400" text-anchor="start">Leader lines retain the true time positions; each stays draggable.</text>
<text x="624" y="868" font-size="12" fill="#607188" font-weight="400" text-anchor="start">Exact inputs and keyboard access remain available for all endpoints.</text>
