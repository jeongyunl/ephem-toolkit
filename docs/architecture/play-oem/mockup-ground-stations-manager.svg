  <text class="muted tiny" x="124" y="368">Latitude · degrees</text>
  <rect x="124" y="375" width="137" height="29" rx="4" fill="#fff" stroke="#9bb8dc"/>
  <text class="ink small" x="134" y="394">64.1466</text>
  <text class="muted tiny" x="280" y="368">Longitude · degrees</text>
  <rect x="280" y="375" width="138" height="29" rx="4" fill="#fff" stroke="#9bb8dc"/>
  <text class="ink small" x="290" y="394">−21.9426</text>
  <text class="muted tiny" x="124" y="424">Ellipsoid height · m</text>
  <rect x="124" y="431" width="137" height="29" rx="4" fill="#fff" stroke="#9bb8dc"/>
  <text class="ink small" x="134" y="450">45</text>
  <text class="muted tiny" x="280" y="424">Minimum elevation</text>
  <rect x="280" y="431" width="138" height="29" rx="4" fill="#fff" stroke="#9bb8dc"/>
  <text class="ink small" x="290" y="450">10°</text>
  <rect class="button" x="124" y="478" width="92" height="31" rx="5"/>
  <text class="ink small" x="170" y="498" text-anchor="middle">Remove…</text>
  <rect class="button" x="226" y="478" width="84" height="31" rx="5"/>
  <text class="ink small" x="268" y="498" text-anchor="middle">Cancel</text>
  <rect class="primary" x="320" y="478" width="98" height="31" rx="5"/>
  <text class="primarytext" x="369" y="498" text-anchor="middle">Save</text>

  <rect class="pane" x="108" y="562" width="326" height="65" rx="8"/>
  <path d="M126 584l5 5 5-5" fill="none" stroke="#687a90" stroke-width="1.7"/>
  <text class="ink heading" x="146" y="588">Equator Station</text>
  <text class="muted tiny" x="124" y="611">0.0000° / 36.8219° · 1,795 m · mask 5°</text>
  <text class="muted tiny" x="112" y="660">Expand a station to edit its details in place.</text>
  <text class="muted tiny" x="112" y="677">Access uses the station mask; terrain is not modeled.</text>

  <rect class="pane" x="472" y="82" width="970" height="650" rx="8"/>
  <text class="ink heading" x="496" y="112">MAIN ANALYSIS</text>
  <rect class="pane" x="490" y="128" width="934" height="270" rx="7"/>
  <text class="ink small" x="510" y="153" font-weight="700">3D Orbit</text><text class="muted tiny" x="1384" y="153" text-anchor="end">ISS · EME2000 / Earth</text>
  <ellipse class="orbit" cx="957" cy="280" rx="293" ry="76" transform="rotate(-12 957 280)"/>
  <ellipse cx="957" cy="280" rx="44" ry="34" fill="#e8f1ff" stroke="#94b9e8" stroke-width="1.4"/>
  <path d="M922 280h70M957 253v54" class="mutedline"/>
  <circle cx="1195" cy="222" r="7" fill="#e14f67" stroke="#fff" stroke-width="2"/>
  <text class="muted tiny" x="970" y="285">Earth</text>
  <rect class="pane" x="490" y="412" width="934" height="300" rx="7"/>
  <text class="ink small" x="510" y="438" font-weight="700">Speed / Altitude</text>
  <line x1="540" y1="482" x2="1390" y2="482" class="grid"/><line x1="540" y1="530" x2="1390" y2="530" class="grid"/>
  <line x1="540" y1="578" x2="1390" y2="578" class="grid"/><line x1="540" y1="626" x2="1390" y2="626" class="grid"/>
  <path class="chart" d="M548 594 C615 544 660 522 726 556 S844 620 916 575 S1054 497 1122 531 S1254 602 1382 542"/>
  <line x1="1084" y1="466" x2="1084" y2="668" stroke="#e14f67" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="40" y="750" width="1400" height="70" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text class="muted small" x="66" y="778">2026-05-20 15:12:00 UTC</text>
  <text class="ink small" x="708" y="778" text-anchor="middle">◀◀   ◀   ▶   ▶▶</text>
  <line x1="98" y1="800" x2="1382" y2="800" stroke="#b9c8d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="98" y1="800" x2="1084" y2="800" stroke="#4381d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1084" cy="800" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
</svg>
