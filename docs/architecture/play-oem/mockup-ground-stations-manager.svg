<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="860" viewBox="0 0 1480 860" role="img" aria-labelledby="title desc">
  <title id="title">Ground Stations manager mock-up</title>
  <desc id="desc">Illustrative play-oem workspace showing the Ground Stations feature page with two saved stations, an Add Ground Station button, and edit and remove actions. The main analysis area remains available beside the manager.</desc>
  <defs>
    <style>
      .bg{fill:#f1f4f8}.window{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.chrome{fill:#e8edf3}
      .ink{fill:#17263a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#63748b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:21px;font-weight:700}.heading{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.tiny{font-size:10px}
      .pane{fill:#fff;stroke:#d5dee9;stroke-width:1.2}.selected{fill:#edf5ff;stroke:#78a9e8;stroke-width:1.4}
      .button{fill:#fff;stroke:#bac8d8;stroke-width:1.2}.primary{fill:#2563eb}.primarytext{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;font-weight:600}
      .rule{stroke:#e1e7ef;stroke-width:1}.grid{stroke:#e3e9f0;stroke-width:1}.chart{fill:none;stroke:#3168ce;stroke-width:2.7;stroke-linecap:round}
      .orbit{fill:none;stroke:#159887;stroke-width:3}.mutedline{fill:none;stroke:#a9b7c8;stroke-width:1.2}
      .icon{fill:none;stroke:#687a90;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .activeicon{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1480" height="860"/>
  <rect class="window" x="20" y="18" width="1440" height="824" rx="14"/>
  <path class="chrome" d="M34 18h1412a14 14 0 0 1 14 14v35H20V32a14 14 0 0 1 14-14z"/>
  <circle cx="47" cy="42" r="5" fill="#ed7777"/><circle cx="65" cy="42" r="5" fill="#e7bd55"/><circle cx="83" cy="42" r="5" fill="#68bd7d"/>
  <text class="muted small" x="105" y="46">play-oem · ISS_2026-05-20.OEM</text>

  <rect class="pane" x="36" y="82" width="420" height="650" rx="8"/>
  <rect x="36" y="82" width="58" height="650" rx="8" fill="#f8fafc"/>
  <line x1="94" y1="82" x2="94" y2="732" class="rule"/>
  <rect x="46" y="105" width="38" height="38" rx="6" fill="#fff" stroke="#d5dee9"/>
  <g class="icon" role="img" aria-label="Settings"><title>Settings</title><circle cx="65" cy="124" r="8"/><circle cx="65" cy="124" r="2.5"/><path d="M65 112v3M65 133v3M53 124h3M74 124h3"/></g>
  <rect x="46" y="153" width="38" height="38" rx="6" fill="#fff" stroke="#d5dee9"/>
  <g class="icon" role="img" aria-label="OEM file information"><title>OEM file information</title><path d="M57 162h11l5 5v16H57zM68 162v5h5M60 172h9M60 177h9"/></g>
  <rect x="46" y="201" width="38" height="38" rx="6" fill="#fff" stroke="#d5dee9"/>
  <g class="icon" role="img" aria-label="State"><title>State</title><path d="M65 208l10 6v12l-10 6-10-6v-12zM55 214l10 6 10-6M65 220v12"/></g>
  <rect x="43" y="249" width="44" height="42" rx="7" fill="#e8f1ff" stroke="#90b6ea" stroke-width="1.3"/>
  <g class="activeicon" role="img" aria-label="Ground Stations selected"><title>Ground Stations selected</title><path d="M65 257v23M59 280h12M60 266a7 7 0 0 1 10 0M56 262a13 13 0 0 1 18 0M65 254v1"/></g>

  <text class="muted tiny" x="112" y="111">CONTROLS &amp; INFO / GROUND STATIONS</text>
  <text class="ink title" x="112" y="148">Ground Stations</text>
  <text class="muted small" x="112" y="170">Manage sites used for geometric access checks.</text>
  <rect class="primary" x="112" y="190" width="180" height="36" rx="6"/>
  <text class="primarytext" x="132" y="213">＋  Add Ground Station</text>
  <text class="muted tiny" x="112" y="251">2 stations</text>

  <rect class="selected" x="108" y="264" width="326" height="286" rx="8"/>
  <path d="M123 281l5 5 5-5" fill="none" stroke="#2563eb" stroke-width="1.7"/>
  <text class="ink heading" x="143" y="291">North Site</text>
  <text class="muted tiny" x="414" y="290" text-anchor="end">Expanded · editing</text>
  <text class="muted tiny" x="124" y="312">Name</text>
  <rect x="124" y="319" width="294" height="29" rx="4" fill="#fff" stroke="#9bb8dc"/>
