<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="650" viewBox="0 0 1480 650" role="img" aria-labelledby="title desc">
  <title id="title">Three-pane play-oem workspace with right pane closed and Playback selected</title>
  <desc id="desc">Playback controls are shown in the Controls and Info pane; the optional Comparison pane is closed, Main Analysis is expanded with a draggable horizontal sash between its panels, and a shared time slider remains below.</desc>
  <defs>
    <style>
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5}
      .window{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .chrome{fill:#e8edf3}
      .ink{fill:#152235;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#65758b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .h2{font-size:20px;font-weight:700}
      .body{font-size:14px}
      .small{font-size:12px}
      .tiny{font-size:10px}
      .tab{fill:#e9eef5;stroke:#d2dbe6;stroke-width:1}
      .tabon{fill:#fff;stroke:#b9c9dc;stroke-width:1.2}
      .panel{fill:#fff;stroke:#dce4ed;stroke-width:1}
      .sash{fill:#cbd5e1}
      .grid{stroke:#dbe4ee;stroke-width:1}
      .line{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .orbit{fill:none;stroke:#22a69a;stroke-width:3;stroke-linecap:round}
      .primary{fill:#2563eb}
      .icon{fill:none;stroke:#65758b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .icon-active{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="card" x="20" y="20" width="1440" height="610" rx="18"/>
  <text class="ink h2" x="48" y="58">G · Three-pane workspace · Playback selected</text>
  <text class="muted small" x="48" y="82">Controls &amp; Info at left · Main Analysis expanded · Comparison closed</text>

  <rect class="window" x="48" y="102" width="1384" height="480" rx="11"/>
  <rect class="chrome" x="48" y="102" width="1384" height="34" rx="11"/>
  <rect class="chrome" x="48" y="123" width="1384" height="13"/>
  <circle cx="69" cy="119" r="5" fill="#9aa8b9"/>
  <circle cx="87" cy="119" r="5" fill="#9aa8b9"/>
  <circle cx="105" cy="119" r="5" fill="#9aa8b9"/>
  <text class="muted small" x="130" y="123">play-oem · ISS_2026-05-20.OEM</text>
  <rect class="tab" x="1250" y="108" width="156" height="23" rx="5"><title>Reopen the right pane with its previous graph stack and size</title></rect>
  <text class="muted tiny" x="1328" y="123" text-anchor="middle">Open Comparison +</text>

  <rect class="panel" x="64" y="150" width="270" height="412" rx="8"/>
  <rect class="tab" x="72" y="160" width="56" height="40" rx="5"/>
  <g class="icon" transform="translate(-13 0)" role="img" aria-label="OEM file information"><title>OEM file information</title>
    <path d="M105 169h12l6 6v16h-18z M117 169v6h6 M108 180h12 M108 184h12"/>
  </g>
  <rect class="tabon" x="72" y="204" width="56" height="40" rx="5"/>
  <g class="icon-active" transform="translate(-13 0)" role="img" aria-label="Playback controls"><title>Playback controls</title>
    <circle cx="113" cy="224" r="11"/>
    <path d="M111 218l9 6-9 6z"/>
  </g>
  <rect class="tab" x="72" y="248" width="56" height="40" rx="5"/>
  <g class="icon" transform="translate(-13 0)" role="img" aria-label="State information"><title>State information</title>
    <path d="M113 257l10 6v12l-10 6-10-6v-12z M103 263l10 6 10-6 M113 269v12"/>
  </g>
  <rect class="tab" x="72" y="292" width="56" height="40" rx="5"/>
  <g class="icon" transform="translate(-13 0)" role="img" aria-label="Settings"><title>Settings</title>
    <circle cx="113" cy="312" r="9"/>
    <circle cx="113" cy="312" r="3"/>
    <path d="M113 300v3 M113 321v3 M101 312h3 M122 312h3 M105 304l2 2 M119 318l2 2 M121 304l-2 2 M107 318l-2 2"/>
  </g>
  <line x1="134" y1="160" x2="134" y2="548" stroke="#dce4ed"/>
  <text class="ink small" x="148" y="184" font-weight="700">CONTROLS &amp; INFO · PLAYBACK</text>
  <text class="muted tiny" x="148" y="211">UTC TIME</text>
  <text class="ink tiny" x="148" y="229">2026-05-20</text>
  <text class="ink tiny" x="148" y="245">02:14:32.4</text>
  <rect class="primary" x="148" y="263" width="172" height="34" rx="6"/>
  <text class="white small" x="234" y="285" text-anchor="middle">Ⅱ Pause</text>
  <rect class="tab" x="148" y="305" width="82" height="30" rx="6"/>
  <text class="ink tiny" x="189" y="324" text-anchor="middle">Reverse</text>
  <rect class="tab" x="238" y="305" width="82" height="30" rx="6"/>
  <text class="ink tiny" x="279" y="324" text-anchor="middle">Step</text>
  <text class="muted tiny" x="148" y="361">PLAYBACK SPEED</text>
  <text class="ink small" x="148" y="382" font-weight="700">−60×</text>
  <line x1="148" y1="400" x2="320" y2="400" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="214" cy="400" r="6" class="primary"/>
  <text class="muted tiny" x="148" y="426">Cursor · interpolated</text>
  <text class="ink tiny" x="148" y="445">7.84 km/s · 421 km</text>
  <text class="muted tiny" x="148" y="470">Playback controls and</text>
  <text class="muted tiny" x="148" y="486">readouts live on this page.</text>

  <rect class="sash" x="339" y="150" width="6" height="412" rx="3"/>
  <rect class="panel" x="350" y="150" width="1066" height="412" rx="8"/>
  <text class="ink small" x="370" y="174" font-weight="700">MAIN ANALYSIS · EXPANDED</text>
  <rect class="tab" x="1308" y="158" width="94" height="23" rx="5"><title>Add a graph panel to the middle stack</title></rect>
  <text class="muted tiny" x="1355" y="173" text-anchor="middle">+ Add graph</text>
  <rect class="panel" x="364" y="188" width="1038" height="166" rx="7"/>
  <rect class="tabon" x="378" y="197" width="190" height="23" rx="5"/>
  <text class="ink tiny" x="388" y="212">Trajectory · 3D</text>
  <text class="muted tiny" x="556" y="212">▾</text>
  <rect class="tab" x="1332" y="197" width="54" height="23" rx="5"><title>Move, duplicate, or close this graph panel</title></rect>
  <text class="muted tiny" x="1359" y="212" text-anchor="middle">More ▾</text>
  <ellipse cx="883" cy="285" rx="250" ry="38" class="orbit"/>
  <ellipse cx="883" cy="285" rx="33" ry="20" fill="#dcecff" stroke="#93bdf8" stroke-width="1.5"/>
  <circle cx="1057" cy="260" r="6" class="primary"/>
  <text class="muted tiny" x="894" y="290">Earth</text>
  <rect class="sash" x="364" y="357" width="1038" height="6" rx="3"/>
  <rect class="panel" x="364" y="366" width="1038" height="182" rx="7"/>
  <rect class="tabon" x="378" y="375" width="190" height="23" rx="5"/>
  <text class="ink tiny" x="388" y="390">Speed / Altitude</text>
  <text class="muted tiny" x="556" y="390">▾</text>
  <rect class="tab" x="1332" y="375" width="54" height="23" rx="5"><title>Move, duplicate, or close this graph panel</title></rect>
  <text class="muted tiny" x="1359" y="390" text-anchor="middle">More ▾</text>
  <line class="grid" x1="382" y1="420" x2="1388" y2="420"/>
  <line class="grid" x1="382" y1="457" x2="1388" y2="457"/>
  <line class="grid" x1="382" y1="494" x2="1388" y2="494"/>
  <path class="line" d="M391 482 C520 443,640 495,760 461 S970 446,1085 480 S1260 450,1380 469"/>
  <rect x="1406" y="188" width="5" height="360" rx="2.5" fill="#edf2f7"/>
  <rect x="1406" y="188" width="5" height="218" rx="2.5" fill="#a8b5c7"/>

  <rect class="window" x="48" y="592" width="1384" height="25" rx="7"/>
  <text class="muted tiny" x="62" y="609">00:00</text>
  <line x1="112" y1="604" x2="1365" y2="604" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="604" x2="624" y2="604" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="624" cy="604" r="7" class="primary"/>
  <text class="muted tiny" x="1417" y="609" text-anchor="end">06:00</text>
</svg>
