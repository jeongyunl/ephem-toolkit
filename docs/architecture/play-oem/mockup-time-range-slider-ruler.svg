<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc">
  <title id="title">C · Precision ruler</title>
  <desc id="desc">Mixed endpoints: fixed start + playback offset end. Each endpoint has one value field followed by a Fixed time checkbox: checked means a fixed UTC timestamp, unchecked means an offset from playback time. OEM coverage is October 23, 2026 from 08:00 to 20:00 UTC. Independent playback bounds are 10:00 to 14:00. The main slider shows playback at 12:00 and plot range 11:00 to 15:00. A before-and-after diagram shows behavior at playback 13:00. Plotting is constrained only by OEM coverage.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
  <rect width="1200" height="954" fill="#f3f6fa" />
  <text x="24" y="36" font-size="23" fill="#24354b" font-weight="700" text-anchor="start">C · Precision ruler</text>
  <text x="24" y="61" font-size="13" fill="#607188" font-weight="400" text-anchor="start">Mixed endpoints: fixed start + playback offset end · choose each endpoint type independently.</text>
  <rect x="24" y="86" width="1152" height="404" rx="8" fill="#ffffff" stroke="#d7e0eb" />
  <text x="48" y="124" font-size="14" fill="#24354b" font-weight="600" text-anchor="start">Playback bounds UTC</text>
  <rect x="222" y="100" width="276" height="34" rx="6" fill="#f8fafd" stroke="#d7e0eb" />
  <text x="235" y="122" font-size="13" fill="#24354b" font-weight="400" text-anchor="start">2026-10-23 10:00:00Z</text>
  <text x="516" y="123" font-size="17" fill="#24354b" font-weight="400" text-anchor="start">→</text>
  <rect x="550" y="100" width="276" height="34" rx="6" fill="#f8fafd" stroke="#d7e0eb" />
  <text x="563" y="122" font-size="13" fill="#24354b" font-weight="400" text-anchor="start">2026-10-23 14:00:00Z</text>
  <rect x="1054" y="100" width="98" height="34" rx="6" fill="#f8fafd" stroke="#d7e0eb" />
  <text x="1103" y="122" font-size="13" fill="#24354b" font-weight="400" text-anchor="middle">Full OEM</text>
  <text x="48" y="153" font-size="11" fill="#607188" font-weight="400" text-anchor="start">Independent of the plot range · only playback-bound edits can limit the clock</text>
