[project]
name = "tudatpy-utils"
version = "0.1.0"
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "numpy>=1.23",
]
keywords = ["astrodynamics", "tudatpy", "orbit", "oem", "tle", "omm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/jeongyunl/tudatpy-utils"

[tool.poetry]
packages = [
    { include = "tudatpy_utils", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
