[project]
name = "ephem-toolkit"
dynamic = ["version"]
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "astropy",
    "astroquery",
    "colorama",
    "numpy>=1.23",
    "pandas",
    "tabulate",
]
keywords = ["astrodynamics", "tudatpy", "orbit", "oem", "tle", "omm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/jeongyunl/ephem-toolkit"

[project.scripts]
diff-oem = "ephem_toolkit.diff_oem:cli"
download-tle = "ephem_toolkit.download_tle:cli"
omm-to-tle = "ephem_toolkit.omm_to_tle:cli"
slice-oem = "ephem_toolkit.slice_oem:cli"
tle-info = "ephem_toolkit.tle_info:cli"
tle-to-omm = "ephem_toolkit.tle_to_omm:cli"
xform-oem = "ephem_toolkit.xform_oem:cli"
oem-to-opm = "ephem_toolkit.oem_to_opm:cli"
oem-to-omm = "ephem_toolkit.oem_to_omm:cli"
oem-to-tle = "ephem_toolkit.oem_to_tle:cli"
propagate-orbit = "ephem_toolkit.propagate_orbit:cli"
propagate-kepler = "ephem_toolkit.propagate_kepler:cli"
propagate-tle = "ephem_toolkit.propagate_tle:cli"
propagate-omm = "ephem_toolkit.propagate_omm:cli"
plot-orbit = "ephem_toolkit.plot_orbit:cli"
plot-orbit-deltas = "ephem_toolkit.plot_orbit_deltas:cli"
plot-dependent-variables = "ephem_toolkit.plot_dep_vars:cli"

[tool.poetry]
name = "ephem-toolkit"
version = "0.0.0"
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
authors = ["Jeongyun Lee <jeongyun@gmail.com>"]
readme = "README.md"
packages = [
    { include = "ephem_toolkit", from = "src" },
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = "v(?P<base>.*)"

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.23"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not accuracy'"
markers = [
    "accuracy: numerical accuracy tests (run with: pytest -m accuracy)",
]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "poetry-dynamic-versioning>=1.0.0,<2.0.0",
]
build-backend = "poetry_dynamic_versioning.backend"
