[project]
name = "tudatpy-utils"
version = "0.1.0"
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "numpy>=1.23",
]
keywords = ["astrodynamics", "tudatpy", "orbit", "oem", "tle", "omm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/jeongyunl/tudatpy-utils"

[project.scripts]
diff-oem = "tudatpy_utils.diff_oem.diff_oem:main"
download-tle = "tudatpy_utils.download_tle.download_tle:main"
omm-to-tle = "tudatpy_utils.omm_to_tle.omm_to_tle:main"
slice-oem = "tudatpy_utils.slice_oem.slice_oem:main"
tle-info = "tudatpy_utils.tle_info.tle_info:main"
tle-to-omm = "tudatpy_utils.tle_to_omm.tle_to_omm:main"
xform-oem = "tudatpy_utils.xform_oem.xform_oem:main"
oem-to-omm = "tudatpy_utils.oem_to_omm.oem_to_omm:main"
evaluate-fit-tle = "tudatpy_utils.evaluate_fit_tle.evaluate_fit_tle:main"
propagate-orbit = "tudatpy_utils.propagate_orbit.propagate_orbit:main"
propagate-kepler = "tudatpy_utils.propagate_kepler.propagate_kepler:main"
propagate-tle = "tudatpy_utils.propagate_tle.propagate_tle:main"
plot-orbit = "tudatpy_utils.plot_orbit.plot_orbit:main"
plot-orbit-deltas = "tudatpy_utils.plot_orbit_deltas.plot_orbit_deltas:main"
plot-dependent-variables = "tudatpy_utils.plot_dep_vars.plot_dependent_variables:main"

[tool.poetry]
name = "tudatpy-utils"
version = "0.1.0"
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
authors = ["Jeongyun Lee <jeongyun@gmail.com>"]
readme = "README.md"
packages = [
    { include = "tudatpy_utils", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.23"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not accuracy'"
markers = [
    "accuracy: numerical accuracy tests (run with: pytest -m accuracy)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
