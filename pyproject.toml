[project]
name = "tudatpy-utils"
version = "0.1.0"
description = "Python utilities and command-line tools for TudatPy astrodynamics workflows"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "numpy>=1.23",
]
keywords = ["astrodynamics", "tudatpy", "orbit", "oem", "tle", "omm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/jeongyunl/tudatpy-utils"

[project.scripts]
diff-oem = "diff_oem.diff_oem:main"
download-tle = "download_tle.download_tle:main"
omm-to-tle = "bin.omm_to_tle:main"
slice-oem = "bin.slice_oem:main"
tle-info = "bin.tle_info:main"
tle-to-omm = "bin.tle_to_omm:main"
xform-oem = "bin.xform_oem:main"
oem-to-omm = "oem_to_omm.oem_to_omm:main"
evaluate-fit-tle = "oem_to_omm.evaluate_fit_tle:main"
propagate-orbit = "tudatpy_utils.cli:propagate_orbit_main"
propagate-kepler = "propagation.propagate_kepler:main"
propagate-tle = "propagation.propagate_tle:main"
plot-orbit = "plotting.plot_orbit:main"
plot-orbit-deltas = "plotting.plot_orbit_deltas:main"
plot-dependent-variables = "plotting.plot_dependent_variables:main"

[tool.poetry]
packages = [
    { include = "tudatpy_utils", from = "src" },
    { include = "download_tle", from = "src" },
    { include = "bin", from = "." },
    { include = "common", from = "src" },
    { include = "diff_oem", from = "src" },
    { include = "oem_to_omm", from = "src" },
    { include = "propagation", from = "." },
    { include = "plotting", from = "." },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
